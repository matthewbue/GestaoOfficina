<section [@filterAnimation]="filteractive ? 'visible' : 'hidden'">
  <div>
    <div class="col-12">
      <div class="card">
        <div class="content-header"></div>
        <form [formGroup]="formSearchOs">
          <div class="card-content">
            <div class="card-body">
              <div class="row">
                <div class="col-md-6">
                  <fieldset class="form-group">
                    <label for="ordemNumero">Ordem Número:</label>
                    <input type="number" class="form-control" id="ordemNumero" formControlName="ordemNumero"
                      placeholder="Número da OS" />
                  </fieldset>
                  <fieldset class="form-group">
                    <label for="nomeCliente">Nome do cliente:</label>
                    <input type="text" class="form-control" id="nomeCliente" formControlName="nomeCliente"
                      placeholder="Nome do cliente" />
                  </fieldset>
                </div>
                <div class="col-md-6">
                  <div class="form-group">
                    <div class="row">
                      <div class="col-md-6">
                        <label for="dataInicial">Data Inicial:</label>
                        <input type="date" class="form-control" formControlName="dataInicial" id="dataInicial" />
                      </div>
                      <div class="col-md-6">
                        <label for="dataFinal">Data Final:</label>
                        <input type="date" class="form-control" formControlName="dataFinal" id="dataFinal" />
                      </div>
                    </div>
                  </div>
                  <fieldset class="form-group">
                    <label for="statusOs">Status:</label>
                    <select class="form-control" formControlName="statusOs" id="statusOs">
                      <option value="">Todos</option>
                      <option value="andamento">Em andamento</option>
                      <option value="finalizado">Finalizado</option>
                    </select>
                  </fieldset>
                </div>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
<section>
  <div class="col-12">
  <app-taskboard (filterToggle)="onFilterToggle()"></app-taskboard>
</div>
</section>
